<svg width="700" height="40" viewBox="0 0 700 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text {
        font-family: 'Courier New', Courier, monospace;
        font-size: 15px;
        fill: #58a6ff;
        text-anchor: middle;
      }
      .l1 { animation: fade 20s linear infinite 0s; }
      .l2 { animation: fade 20s linear infinite -16s; }
      .l3 { animation: fade 20s linear infinite -12s; }
      .l4 { animation: fade 20s linear infinite -8s; }
      .l5 { animation: fade 20s linear infinite -4s; }

      @keyframes fade {
        0%   { opacity: 0; }
        5%   { opacity: 1; }
        20%  { opacity: 1; }
        25%  { opacity: 0; }
        100% { opacity: 0; }
      }
    </style>
  </defs>

  <text class="l1" x="350" y="27">Building agentic LLM systems for Fortune 30 clients</text>
  <text class="l2" x="350" y="27">Designing hybrid RAG pipelines at enterprise scale</text>
  <text class="l3" x="350" y="27">80% faster analysis — $1M in operational cost savings</text>
  <text class="l4" x="350" y="27">Fine-tuning Llama 3.1, Phi-3, Gemma with LoRA / QLoRA</text>
  <text class="l5" x="350" y="27">Deep Agents — LangGraph — Anthropic Claude — OpenAI</text>
</svg>
